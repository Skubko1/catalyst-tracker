name: catalyst-calendar
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: catalyst-calendar
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        run: npm install
      - name: Init DB
        run: npm run init-db
      - name: Collect calendar catalysts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm run calendar
      - name: Persist event DB
        run: |
          git config user.name  "catalyst-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/catalysts.db
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "state: update event db [skip ci]"
            git push || (git pull --rebase --autostash && git push)
          fi
